[project]
name = "mcp-a-creator"
version = "0.1.0"
description = "An MCP server that builds custom MCP servers on Databricks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.14,<3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # A code generator formats its own output, so ruff is a runtime
    # dependency rather than a dev one.
    "ruff>=0.6.0",
]

[project.optional-dependencies]
# Needed only for live Unity Catalog inspection and for generated servers
# that read governed data. The server runs fully without them.
databricks = [
    "databricks-sdk>=0.30.0",
    "databricks-sql-connector>=3.0.0",
    "mlflow-skinny>=3.12,<4",
]

[project.scripts]
mcp-a-creator = "mcp_server_creator.app:main"
# One command that answers "will this even start here?" before anyone
# connects a client.
mcp-a-creator-doctor = "mcp_server_creator.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Includes the bundled skills/ and knowledge/ markdown, which the running
# server reads at runtime.
packages = ["src/mcp_server_creator"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The generator holds generated source as string literals. Its SQL lines
# carry an inline `# nosemgrep` that must stay on the same line (so the
# generated server inherits it); the generated lines themselves fit in 88.
"src/mcp_server_creator/generators/toolcode.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
